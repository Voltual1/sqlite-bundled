name: Build sqlite-bundled from AOSP

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize repo
        run: |
          mkdir androidx
          cd androidx
          repo init -u https://android.googlesource.com/platform/manifest -b androidx-main --depth=1

      - name: Sync required projects
        run: |
          cd androidx
          # 同步 frameworks/support 和 prebuilts
          repo sync -j8 frameworks/support prebuilts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build sqlite-bundled
        working-directory: androidx/frameworks/support
        run: ./gradlew :sqlite:sqlite-bundled:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-bundled-aar
          path: "**/build/outputs/aar/*.aar"
